server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied to the backend service (docker-compose service
    # name "backend"). The /api/ prefix is preserved: the backend serves
    # /api/v1 itself.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path returns the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
